  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    min-height:100vh; min-height:100dvh;
    background:
      radial-gradient(1200px 700px at 12% -10%, rgba(200,149,47,0.08), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(107,132,85,0.06), transparent 55%),
      var(--ink);
    color:var(--text);
    font-family:'Work Sans','Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }

  .wrap{ width:100%; max-width:720px; display:flex; flex-direction:column; align-items:center; gap:18px; }

  .tagline{ font-family:'Fraunces','Georgia',serif; font-weight:600; font-size:0.95rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-faint); }

  .scene-display{
    width:100%; border-radius:16px; overflow:hidden; border:1px solid var(--line);
    background:var(--ink-2); box-shadow:var(--shadow);
    display:none;
  }
  .scene-display.visible{ display:block; }
  .scene-display img{ display:block; width:100%; max-height:76vh; object-fit:contain; background:#000; }

  .fear-panel{
    position:relative; overflow:hidden; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:34px 22px 28px;
    box-shadow:var(--shadow);
    --fear-color:88,140,199; --fear-opacity:0.16;
    transition:padding .3s ease;
  }
  .fear-panel.compact{
    flex-direction:row; gap:16px; padding:14px 20px;
  }
  .fear-panel.compact .fear-track{ padding-top:0; gap:6px; }
  .fear-panel.compact .fear-pip{ width:clamp(18px,5vw,26px); }
  .fear-panel.compact .fear-label .ft{ font-size:1.1rem; }
  .fear-panel.compact .fear-label .fc{ font-size:0.82rem; }
  .fear-panel::before{
    content:''; position:absolute; inset:-60%; z-index:0; pointer-events:none;
    background:radial-gradient(circle at 50% 45%, rgba(var(--fear-color), 1) 0%, rgba(var(--fear-color),0) 65%);
    opacity:var(--fear-opacity);
    filter:blur(28px);
    transition:opacity .6s ease, background-color .6s ease;
  }

  .fear-label{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .fear-label .ft{ font-family:'Fraunces',serif; font-weight:700; font-size:2rem; letter-spacing:0.03em; color:var(--text); }
  .fear-label .fc{ font-family:'JetBrains Mono',monospace; font-size:1.05rem; color:var(--text-dim); }

  .fear-track{
    position:relative; z-index:1;
    display:flex; gap:clamp(8px,2.4vw,16px); flex-wrap:wrap; justify-content:center;
    padding-top:18px; --horn-scale:0;
    max-width:420px;
  }
  .fear-pip{
    position:relative; width:clamp(30px,9vw,50px); aspect-ratio:32/49; flex-shrink:0; overflow:visible;
  }
  .fp-base, .fp-horn{
    position:absolute; left:0; top:0; width:100%; height:100%;
    -webkit-mask-image:var(--skull-icon); mask-image:var(--skull-icon);
    -webkit-mask-size:100% 100%; mask-size:100% 100%;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center top; mask-position:center top;
    background-color:rgba(150,160,178,0.32);
    transition:background-color .3s;
  }
  .fp-base{
    clip-path:polygon(0% 0%,100% 0%,100% 4.37%,65.56% 4.37%,65.56% 33.5%,100% 33.5%,100% 100%,0% 100%,0% 33.5%,34.44% 33.5%,34.44% 4.37%,0% 4.37%);
  }
  .fp-horn{ transform:scaleY(var(--horn-scale,0)); }
  .fp-horn-l{
    clip-path:polygon(0% 4.37%,34.44% 4.37%,34.44% 33.5%,0% 33.5%);
    transform-origin:50% 33.5%;
  }
  .fp-horn-r{
    clip-path:polygon(65.56% 4.37%,100% 4.37%,100% 33.5%,65.56% 33.5%);
    transform-origin:50% 33.5%;
  }
  .fear-pip.marked .fp-base, .fear-pip.marked .fp-horn{
    background-color:rgb(var(--fear-color));
    filter:drop-shadow(0 0 7px rgba(var(--fear-color),0.85)) drop-shadow(0 0 2px rgba(255,255,255,0.5));
  }

  .live-status{
    font-family:'JetBrains Mono',monospace; font-size:0.72rem; letter-spacing:0.04em;
    color:var(--text-faint); display:flex; align-items:center; gap:6px;
  }
  .live-status.ok{ color:var(--moss-bright); }
  .live-status.warn{ color:var(--rust-bright); }

  .footnote{ text-align:center; font-size:0.68rem; color:var(--text-faint); line-height:1.5; max-width:420px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tagline">Beast Feast — Daggerheart</div>
    <div class="scene-display" id="sceneDisplay"><img id="sceneImg" alt="Scena"></div>
    <div class="fear-panel" id="fearPanel">
      <div class="fear-label">
        <span class="ft">Fear</span>
        <span class="fc" id="fearCount">0 / 12</span>
      </div>
      <div class="fear-track" id="fearTrack"></div>
    </div>
    <div class="live-status" id="liveStatus">● Łączenie…</div>
    <div class="footnote">Ta strona pokazuje na żywo licznik Fear i obraz sceny — kontrolowane przez Mistrza Gry w Arenie Bestii. Możesz zostawić ją otwartą przez całą sesję.</div>
  </div>

<script>
(function(){
  'use strict';
  var FEAR_DB_URL = 'https://daggerheart-fear-default-rtdb.europe-west1.firebasedatabase.app';
  var FEAR_LIVE_SECRET = '136e9f278a37dedcbebfc35bc7a0ef867ca6841e';
  var FEAR_MAX = 12;
  var FEAR_BLUE = [88,140,199];
  var FEAR_RED = [196,45,45];

  // local mirror of live/<secret> in Firebase
  var state = { fear: 0, scene: { file: '', visible: false } };

  var track, panel, countEl, statusEl, sceneDisplay, sceneImg;

  function $(id){ return document.getElementById(id); }

  function renderFear(){
    var fear = Math.max(0, Math.min(FEAR_MAX, Number(state.fear) || 0));
    var t = fear / FEAR_MAX;
    var c = [0,1,2].map(function(i){ return Math.round(FEAR_BLUE[i] + (FEAR_RED[i]-FEAR_BLUE[i]) * t); });
    panel.style.setProperty('--fear-color', c.join(','));
    panel.style.setProperty('--fear-opacity', (0.16 + t * 0.56).toFixed(3));
    countEl.textContent = fear + ' / ' + FEAR_MAX;
    track.style.setProperty('--horn-scale', (t * 2).toFixed(3));

    if(track.childElementCount !== FEAR_MAX){
      track.innerHTML = '';
      for(var i=0;i<FEAR_MAX;i++){
        var p = document.createElement('div');
        p.className = 'fear-pip';
        p.innerHTML = '<div class="fp-base"></div><div class="fp-horn fp-horn-l"></div><div class="fp-horn fp-horn-r"></div>';
        track.appendChild(p);
      }
    }
    Array.prototype.forEach.call(track.children, function(p, i){
      p.classList.toggle('marked', i < fear);
    });
  }

  function renderScene(){
    var sc = state.scene || {};
    var show = !!(sc.visible && sc.file);
    if(show){
      if(sceneImg.getAttribute('src') !== sc.file) sceneImg.setAttribute('src', sc.file);
      sceneDisplay.classList.add('visible');
    } else {
      sceneDisplay.classList.remove('visible');
    }
    panel.classList.toggle('compact', show);
  }

  function setStatus(text, cls){
    statusEl.textContent = text;
    statusEl.className = 'live-status' + (cls ? ' ' + cls : '');
  }

  // apply a Firebase SSE event's {path, data} onto our local `state` mirror.
  // path is '/' (whole node), '/fear', '/scene', or a deeper subpath.
  function applyPatch(path, data){
    if(!path || path === '/'){
      state = data && typeof data === 'object' ? data : { fear: 0, scene: { file:'', visible:false } };
      if(!state.scene) state.scene = { file:'', visible:false };
      return;
    }
    var parts = path.replace(/^\//,'').split('/').filter(Boolean);
    if(!parts.length) return;
    if(parts[0] === 'fear'){
      state.fear = data;
    } else if(parts[0] === 'scene'){
      if(parts.length === 1){
        state.scene = data && typeof data === 'object' ? data : { file:'', visible:false };
      } else {
        if(!state.scene) state.scene = { file:'', visible:false };
        state.scene[parts[1]] = data;
      }
    }
  }

  function boot(){
    track = $('fearTrack'); panel = $('fearPanel'); countEl = $('fearCount'); statusEl = $('liveStatus');
    sceneDisplay = $('sceneDisplay'); sceneImg = $('sceneImg');
    renderFear(); renderScene();

    if(!('EventSource' in window)){
      setStatus('● Przeglądarka nie wspiera trybu live', 'warn');
      return;
    }

    var connectedOnce = false;
    var url = FEAR_DB_URL + '/live/' + FEAR_LIVE_SECRET + '.json';
    var es = new EventSource(url);

    function handle(e){
      try{
        var payload = JSON.parse(e.data);
        if(!payload) return;
        applyPatch(payload.path, payload.data);
        renderFear();
        renderScene();
        connectedOnce = true;
        setStatus('● Live', 'ok');
      }catch(err){ /* ignore malformed event */ }
    }

    es.addEventListener('put', handle);
    es.addEventListener('patch', handle);
    es.onerror = function(){
      setStatus(connectedOnce ? '● Łączenie ponownie…' : '● Brak połączenia z serwerem', 'warn');
    };
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
