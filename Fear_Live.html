  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    min-height:100vh; min-height:100dvh;
    background:
      radial-gradient(1200px 700px at 12% -10%, rgba(200,149,47,0.08), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(107,132,85,0.06), transparent 55%),
      var(--ink);
    color:var(--text);
    font-family:'Work Sans','Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }

  .wrap{ width:100%; max-width:720px; display:flex; flex-direction:column; align-items:center; gap:18px; }

  .scene-display{
    width:100%; border-radius:16px; overflow:hidden; border:1px solid var(--line);
    background:var(--ink-2); box-shadow:var(--shadow);
    display:none;
  }
  .scene-display.visible{ display:block; }
  .scene-display img{ display:block; width:100%; max-height:66vh; object-fit:contain; background:#000; }

  .fear-panel{
    position:relative; width:100%; flex-shrink:0;
    background:
      radial-gradient(620px 280px at 50% -30%, rgba(var(--fear-color),0.14), transparent 70%),
      var(--panel);
    border:1px solid var(--gold-bright);
    outline:1px solid rgba(224,179,85,0.32);
    outline-offset:-6px;
    border-radius:18px;
    padding:22px clamp(12px,4.4vw,34px) 18px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .corner-dot{ position:absolute; width:5px; height:5px; border-radius:50%; background:var(--gold-bright); box-shadow:0 0 6px 1px rgba(224,179,85,0.65); z-index:3; }
  .corner-dot.tl{ top:10px; left:10px; } .corner-dot.tr{ top:10px; right:10px; }
  .corner-dot.bl{ bottom:10px; left:10px; } .corner-dot.br{ bottom:10px; right:10px; }

  .flame-stage{ position:relative; z-index:1; height:clamp(88px,21vw,116px); }
  .flame-canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  .fear-track{
    position:relative; z-index:1; height:100%;
    display:flex; align-items:flex-end; justify-content:center; flex-wrap:nowrap; pointer-events:none;
  }
  .flame-group{ display:flex; align-items:flex-end; height:100%; gap:clamp(3px,1.5vw,11px); }

  .fear-counter{
    flex-shrink:0; width:clamp(48px,10.5vw,60px); height:clamp(48px,10.5vw,60px); border-radius:50%;
    border:2px solid var(--gold-bright); background:var(--ink-2);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; font-size:clamp(1.15rem,3.2vw,1.45rem); color:var(--text);
    box-shadow: inset 0 0 12px rgba(0,0,0,0.55), 0 0 12px rgba(224,179,85,0.25);
    margin:0 clamp(7px,2.4vw,18px);
    font-variant-numeric: tabular-nums;
    position:relative; z-index:2;
    align-self:flex-end;
    margin-bottom: clamp(4px,1vw,8px);
  }

  .flame-slot{ position:relative; width:clamp(22px,6.8vw,36px); height:100%; flex-shrink:0; }

  .fp-icon-wrap{
    position:absolute; left:50%; bottom:0; width:100%; aspect-ratio:369/421;
    transform:translateX(-50%); pointer-events:none;
    opacity:1; z-index:2;
  }
  .fp-glow{
    position:absolute; inset:-55%; z-index:0; pointer-events:none; border-radius:50%;
    background:radial-gradient(circle, rgba(var(--fear-color),1) 0%, rgba(var(--fear-color),0) 68%);
    opacity:0; filter:blur(6px);
  }
  .flame-slot.lit .fp-glow{ animation:fear-flicker 2.4s infinite ease-in-out; }
  .fp-fill{
    position:absolute; inset:0; z-index:1;
    -webkit-mask-image:var(--token-icon); mask-image:var(--token-icon);
    -webkit-mask-size:100% 100%; mask-size:100% 100%;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center top; mask-position:center top;
    background-color:var(--icon-idle-color);
    filter:drop-shadow(0 0 2px rgba(0,0,0,0.5));
    transition:background-color .35s ease;
  }
  .flame-slot.lit .fp-fill{
    background:none;
    background-color:rgb(var(--fear-contrast));
    filter:drop-shadow(0 0 3px rgba(0,0,0,0.55)) drop-shadow(0 0 6px rgba(var(--fear-contrast),0.6));
  }

  @keyframes fear-flicker{
    0%   { opacity: var(--flicker-amt,0.4); }
    8%   { opacity: calc(var(--flicker-amt,0.4) * 0.45); }
    15%  { opacity: var(--flicker-amt,0.4); }
    25%  { opacity: calc(var(--flicker-amt,0.4) * 0.15); }
    33%  { opacity: calc(var(--flicker-amt,0.4) * 0.75); }
    45%  { opacity: var(--flicker-amt,0.4); }
    58%  { opacity: calc(var(--flicker-amt,0.4) * 0.35); }
    70%  { opacity: calc(var(--flicker-amt,0.4) * 0.85); }
    80%  { opacity: var(--flicker-amt,0.4); }
    90%  { opacity: calc(var(--flicker-amt,0.4) * 0.55); }
    100% { opacity: var(--flicker-amt,0.4); }
  }

  .live-status{
    font-family:'JetBrains Mono',monospace; font-size:0.72rem; letter-spacing:0.04em;
    color:var(--text-faint); display:flex; align-items:center; gap:6px;
  }
  .live-status.ok{ color:var(--moss-bright); }
  .live-status.warn{ color:var(--rust-bright); }

</style>

<script>

  var ICON_COLORS_DEFAULT = { idle:'#382d7a', activeLow:'#e0b355', activeHigh:'#81cdc3' };

    var stops = activeFlameStops();
    var n = stops.length - 1;
    var pos = Math.max(0, Math.min(1, t)) * n;
    var idx = Math.min(n - 1, Math.floor(pos));
    return stops[idx].map(function(v,i){ return Math.round(v + (stops[idx+1][i]-v) * (pos-idx)); });
  }

  // tempo/gęstość/turbulencja ognia rosną z Fear: przy niskim leniwie i rzadko (nieliczne,
  // wolne iskry), przy wysokim gwałtownie i gęsto (mnóstwo szybkich, drgających cząstek)
  function paramsForFear(fearVal){
    var t = fearVal/FEAR_MAX;
    return {
      t: t,
      energy: lerp(0.22, 1.6, t),
      spawnRate: lerp(20, 85, t),
      life: lerp(1.1, 0.4, t),
      wobFreqScale: lerp(0.4, 2.2, t),
      wobAmtScale: lerp(0.5, 2.0, t),
      vxScale: lerp(0.5, 1.35, t),
      pull: lerp(1.6, 4.2, t)
    };
  }

  // stan emitera pojedynczego slotu — samo płonięcie/gaśnięcie; kształt płomienia
  // powstaje z chmury wielu małych, granularnych cząstek (particle physics), nie z wektorowej sylwetki
  function makeFlameState(){
    return { active:false, acc: Math.random() };
  }

  function spawnParticle(i, opts){
    opts = opts || {};
    var p = paramsForFear(lastFear);
    var life = opts.life!=null ? opts.life : (p.life * rand(0.85,1.15));
    var spread = opts.spread!=null ? opts.spread : 0.85;
    var cx = emitX[i];
    embers.push({
      idx:i, cx:cx,
      x: cx + rand(-1,1)*spread*(iconW[i]*0.48),
      y: iconBottom[i],
      vx: rand(-6,6)*p.vxScale,
      wobFreq: rand(1.3,2.3)*p.wobFreqScale,
      wobPhase: Math.random()*Math.PI*2,
      wobAmt: rand(2.5,5.5)*p.wobAmtScale,
      energy: p.energy,
      pull: p.pull,
      vy: -(smokeMaxH[i]/life) * rand(0.85,1.1),
      life: life, age:0,
      size: opts.size!=null ? opts.size : rand(iconW[i]*0.22, iconW[i]*0.34),
      hot: opts.hot!=null ? opts.hot : 1
    });
  }

  function igniteFlash(i){
    var p = paramsForFear(lastFear);
    var burstCount = Math.round(lerp(7, 20, p.t));
    for(var k=0;k<burstCount;k++) spawnParticle(i, {spread:0.95, life: rand(0.32,0.52)*lerp(1.3,0.8,p.t)});
    spawnParticle(i, {spread:0.28, size:iconW[i]*0.4, hot:1.6, life:0.26+p.t*0.14});
  }

  function buildTrack(){
    track.innerHTML = '';
    var groupL = document.createElement('div'); groupL.className = 'flame-group';
    var groupR = document.createElement('div'); groupR.className = 'flame-group';
    var counter = document.createElement('div'); counter.className = 'fear-counter'; counter.id = 'fearCounter';

    slotEls = []; iconWraps = []; flames = [];
    for(var i=0;i<FEAR_MAX;i++){
      var slot = document.createElement('div');
      slot.className = 'flame-slot';
      slot.innerHTML = '<div class="fp-icon-wrap"><div class="fp-glow"></div><div class="fp-fill"></div></div>';
      (i<6?groupL:groupR).appendChild(slot);
      slotEls.push(slot);
      iconWraps.push(slot.querySelector('.fp-icon-wrap'));
      flames.push(makeFlameState());
    }
    track.appendChild(groupL); track.appendChild(counter); track.appendChild(groupR);
  }

  function measure(){
    var stageRect = stage.getBoundingClientRect();
    cssW = stageRect.width; cssH = stageRect.height;
    if(cssW < 1 || cssH < 1) return;
    canvas.width = Math.round(cssW*dpr); canvas.height = Math.round(cssH*dpr);
    canvas.style.width = cssW+'px'; canvas.style.height = cssH+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);

    emitX = []; emitY = []; smokeMaxH = []; iconW = []; iconBottom = [];
    for(var i=0;i<iconWraps.length;i++){
      var r = iconWraps[i].getBoundingClientRect();
      var cx = (r.left + r.width/2) - stageRect.left;
      var topY = r.top - stageRect.top;
      var botY = r.bottom - stageRect.top;
      emitX.push(cx); emitY.push(topY); iconBottom.push(botY); iconW.push(r.width);
      smokeMaxH.push(Math.max(20, botY - 6));
    }
  }

  function renderFear(){
    var fear = Math.max(0, Math.min(FEAR_MAX, Number(state.fear) || 0));
    var t = fear / FEAR_MAX;
    var col = colorForFear(t);
    var iconCols = activeIconColors();
    var activeIconRgb = lerpColor(hexToRgb(iconCols.activeLow), hexToRgb(iconCols.activeHigh), t);
    panel.style.setProperty('--fear-color', col.join(','));
    panel.style.setProperty('--fear-contrast', activeIconRgb.join(','));
    panel.style.setProperty('--flicker-amt', (0.32+t*0.4).toFixed(3));
    panel.style.setProperty('--icon-idle-color', iconCols.idle);

    if(track.childElementCount !== 3){ buildTrack(); measure(); }
    var counterEl = $('fearCounter');
    if(counterEl) counterEl.textContent = fear;

    for(var i=0;i<FEAR_MAX;i++){
      var shouldBurn = i < fear;
      var fs = flames[i];
      slotEls[i].classList.toggle('lit', shouldBurn);
      if(shouldBurn && !fs.active){ fs.active = true; lastFear = fear; igniteFlash(i); }
      else if(!shouldBurn && fs.active){ fs.active = false; }
    }
    lastFear = fear;
  }

  function step(ts){
    if(lastT===null) lastT = ts;
    var dt = Math.min(0.05, (ts-lastT)/1000);
    lastT = ts; time += dt;

    if(cssW < 1) { requestAnimationFrame(step); return; }

    var fearColor = colorForFear(lastFear/FEAR_MAX);
    var liveParams = paramsForFear(lastFear);

    for(var i=0;i<FEAR_MAX;i++){
      var fs = flames[i];
      if(!fs || !fs.active) continue;
      fs.acc += dt*liveParams.spawnRate;
      while(fs.acc >= 1){ spawnParticle(i); fs.acc -= 1; }
    }

    ctx.clearRect(0,0,cssW,cssH);
    ctx.globalCompositeOperation = 'lighter';

    var counts = {};
    for(var p2=0;p2<embers.length;p2++){ counts[embers[p2].idx] = (counts[embers[p2].idx]||0)+1; }
    Object.keys(counts).forEach(function(key){
      var i = +key;
      var c = fearColor;
      var r = iconW[i]*0.6;
      var g = ctx.createRadialGradient(emitX[i], iconBottom[i], 0, emitX[i], iconBottom[i], r);
      g.addColorStop(0, 'rgba('+c[0]+','+c[1]+','+c[2]+',0.30)');
      g.addColorStop(1, 'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(emitX[i], iconBottom[i], r, 0, Math.PI*2); ctx.fill();
    });

    var alive = [];
    for(var p=0;p<embers.length;p++){
      var pt = embers[p];
      pt.age += dt;
      var t = pt.age/pt.life;
      if(t >= 1) continue;
      var toCenter = (pt.cx - pt.x) * pt.pull * t;
      pt.x += (pt.vx + Math.sin(time*pt.energy*pt.wobFreq + pt.wobPhase)*pt.wobAmt + toCenter) * dt;
      pt.y += pt.vy * dt * (1 - t*0.2);

      var fadeIn = Math.min(1, t/0.10);
      var fadeOut = 1 - Math.max(0, (t-0.55))/0.45;
      var alpha = Math.max(0, Math.min(fadeIn, fadeOut)) * pt.hot;
      var size = pt.size * (1 - t*0.5) * (pt.hot>1 ? (1+(1-t)*0.6) : 1);

      var mixT = Math.min(1, t/0.65);
      var col = lerpColor(HOT, fearColor, mixT);

      var stretch = 1 + Math.min(1.3, Math.abs(pt.vy)/140);
      var squish = 1/Math.sqrt(stretch);
      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.scale(squish, stretch);
      var grd = ctx.createRadialGradient(0,0,0, 0,0, Math.max(0.1,size));
      grd.addColorStop(0, 'rgba('+col[0]+','+col[1]+','+col[2]+','+(0.95*alpha)+')');
      grd.addColorStop(0.55, 'rgba('+col[0]+','+col[1]+','+col[2]+','+(0.45*alpha)+')');
      grd.addColorStop(1, 'rgba('+col[0]+','+col[1]+','+col[2]+',0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(0,0,Math.max(0.1,size),0,Math.PI*2); ctx.fill();
      ctx.restore();

      alive.push(pt);
    }
    embers = alive;
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(step);
  }

  function renderScene(){
    var sc = state.scene || {};
    var show = !!(sc.visible && sc.file);
    if(show){
      if(sceneImg.getAttribute('src') !== sc.file) sceneImg.setAttribute('src', sc.file);
      sceneDisplay.classList.add('visible');
    } else {
      sceneDisplay.classList.remove('visible');
    }
  }

  function setStatus(text, cls){
    statusEl.textContent = text;
    statusEl.className = 'live-status' + (cls ? ' ' + cls : '');
  }

  // apply a Firebase SSE event's {path, data} onto our local `state` mirror.
  // path is '/' (whole node), '/fear', '/scene', or a deeper subpath.
  function applyPatch(path, data){
    if(!path || path === '/'){
      state = data && typeof data === 'object' ? data : { fear: 0, scene: { file:'', visible:false }, colors: null, audio: null };
      if(!state.scene) state.scene = { file:'', visible:false };
      if(state.colors === undefined) state.colors = null;
      if(state.audio === undefined) state.audio = null;
      return;
    }
    var parts = path.replace(/^\//,'').split('/').filter(Boolean);
    if(!parts.length) return;
    if(parts[0] === 'fear'){
      state.fear = data;
    } else if(parts[0] === 'scene'){
      if(parts.length === 1){
        state.scene = data && typeof data === 'object' ? data : { file:'', visible:false };
      } else {
        if(!state.scene) state.scene = { file:'', visible:false };
        state.scene[parts[1]] = data;
      }
    } else if(parts[0] === 'colors'){
      state.colors = (data && typeof data === 'object') ? data : null;
    } else if(parts[0] === 'audio'){
      state.audio = (data && typeof data === 'object') ? data : null;
    }
  }

  // ---------------- background audio (YouTube, pushed live from Arena Bestii) ----------------
  // Hidden YouTube players, no visible UI. Several tracks can play at once (e.g. ambience +
  // a stinger), each with its own volume/loop.
  //
  // Autoplay policy: a browser only lets a page make sound after it has seen a user gesture,
  // and — crucially — that permission is earned by the *iframe*, not by the page as a whole.
  // The old code created a fresh YT.Player per track and destroyed it on stop, so every time
  // the GM swapped a track the new iframe hit the block again and the players had to click
  // "włącz dźwięk" all over. Instead we keep a POOL of players alive: switching a track reuses
  // an iframe that is already allowed to make sound (loadVideoById keeps playing without any
  // new gesture), and a couple of spare players are primed during the one unlock click so
  // adding a *second* simultaneous track later doesn't need one either. Players are paused and
  // returned to the pool rather than destroyed.
  var POOL_SPARE = 2;        // idle, already-unlocked players kept ready for future tracks
  var STUCK_CHECK_MS = 1500; // how long to wait before deciding a track is blocked

  var ytReady = false;
  var audioEverPlayed = false;   // has any track actually reached PLAYING in this page?
  var ytPool = [];               // all players, alive for the lifetime of the page
  var ytByVid = {};              // videoId -> pool entry currently assigned to it
  var activeAudio = {};          // videoId -> {loop, volume, playToken} mirrored from Firebase
  var poolSeq = 0;

  function normalizeActiveAudio(raw){
    var out = {};
    if(raw && typeof raw === 'object'){
      Object.keys(raw).forEach(function(vid){
        if(!/^[A-Za-z0-9_-]{11}$/.test(vid)) return;
        var a = raw[vid];
        if(!a || typeof a !== 'object') return;
        var vol = (typeof a.volume === 'number' && a.volume >= 0 && a.volume <= 100) ? a.volume : 70;
        var token = (typeof a.playToken === 'number') ? a.playToken : 0;
        out[vid] = { loop: !!a.loop, volume: vol, playToken: token };
      });
    }
    return out;
  }

  function syncAudioFromState(){
    activeAudio = normalizeActiveAudio(state.audio);
    applyActiveAudio();
  }

  /* ---- pool plumbing ---- */

  function newPoolEntry(){
    var div = document.createElement('div');
    div.id = 'yt-slot-' + (poolSeq++);
    $('ytAudioPlayers').appendChild(div);
    var entry = { node:div, player:null, ready:false, vid:null, lastToken:-1, priming:false };
    ytPool.push(entry);
    return entry;
  }

  function buildPlayer(entry, videoId){
    entry.player = new YT.Player(entry.node.id, {
      height: '1', width: '1', videoId: videoId,
      playerVars: { autoplay:0, controls:0, disablekb:1, modestbranding:1, rel:0, playsinline:1 },
      events: {
        onReady: function(){
          entry.ready = true;
          if(entry.priming){ primeEntry(entry); return; }
          if(entry.vid){
            entry.lastToken = -1;
            applyToEntry(entry);
            scheduleStuckCheck(entry);
          }
        },
        onStateChange: function(e){
          if(e.data === YT.PlayerState.PLAYING){
            if(!entry.priming){
              audioEverPlayed = true;
              removeAudioUnlock();
              scheduleWarm(); // audio is demonstrably allowed right now — top the spares back up
            }
          }
          if(e.data === YT.PlayerState.ENDED && entry.vid){
            var d = activeAudio[entry.vid];
            if(d && d.loop){ try{ entry.player.seekTo(0); entry.player.playVideo(); }catch(err){} }
          }
        }
      }
    });
  }

  // "Prime" a spare player: let it actually reach audible playback once (at volume 0, so nobody
  // hears it) while the page still has the user's gesture, then park it. From then on the browser
  // treats that iframe as allowed to make sound, so a future track can take it over silently.
  function primeEntry(entry){
    try{
      entry.player.unMute();
      entry.player.setVolume(0);
      entry.player.playVideo();
    }catch(err){}
    setTimeout(function(){
      if(entry.vid) return; // got claimed by a real track in the meantime — leave it playing
      try{ entry.player.pauseVideo(); }catch(err){}
      entry.priming = false;
    }, 1500);
  }

  function takeIdleEntry(){
    for(var i=0;i<ytPool.length;i++){
      var e = ytPool[i];
      if(!e.vid && e.ready && e.player && !e.priming) return e;
    }
    return null;
  }

  function releaseEntry(entry){
    try{ if(entry.ready && entry.player){ entry.player.pauseVideo(); entry.player.setVolume(0); } }catch(err){}
    entry.vid = null;
    entry.lastToken = -1;
  }

  // Keep POOL_SPARE idle players around, no more: destroy the surplus so we don't sit on a
  // dozen loaded YouTube iframes after a long session.
  function trimPool(){
    var idle = ytPool.filter(function(e){ return !e.vid && !e.priming; });
    for(var i = POOL_SPARE; i < idle.length; i++){
      var e = idle[i];
      try{ if(e.player && e.player.destroy) e.player.destroy(); }catch(err){}
      if(e.node && e.node.parentNode) e.node.parentNode.removeChild(e.node);
      ytPool.splice(ytPool.indexOf(e), 1);
    }
  }

  // Refill the spares shortly after a track starts playing. Debounced, and only once audio has
  // actually been heard — a spare built while the page is still muted would not be unlocked.
  var warmTimer = null;
  function scheduleWarm(){
    if(!audioEverPlayed || warmTimer) return;
    warmTimer = setTimeout(function(){ warmTimer = null; warmPool(); }, 2500);
  }

  // Build spare players now, while we're allowed to make sound.
  function warmPool(){
    if(!ytReady) return;
    var seed = Object.keys(activeAudio)[0];
    if(!seed) return; // nothing playing yet — nothing to seed a spare player with
    var idle = ytPool.filter(function(e){ return !e.vid; }).length;
    for(var i = idle; i < POOL_SPARE; i++){
      var e = newPoolEntry();
      e.priming = true;
      buildPlayer(e, seed);
    }
  }

  /* ---- desired-state application ---- */

  function applyActiveAudio(){
    // hand back players for tracks the GM stopped (paused, not destroyed — they stay unlocked)
    Object.keys(ytByVid).forEach(function(vid){
      if(activeAudio[vid]) return;
      releaseEntry(ytByVid[vid]);
      delete ytByVid[vid];
    });

    Object.keys(activeAudio).forEach(function(vid){
      var entry = ytByVid[vid];
      if(entry){ applyToEntry(entry); return; }

      var reused = takeIdleEntry();
      if(reused){
        // the whole point: this iframe is already allowed to make sound, so swapping the
        // video in it starts playing straight away — no second "zezwól na dźwięk" click.
        ytByVid[vid] = reused;
        reused.vid = vid;
        reused.lastToken = -1;
        try{ reused.player.unMute(); reused.player.loadVideoById(vid); }catch(err){}
        applyToEntry(reused);
        scheduleStuckCheck(reused);
      } else {
        var fresh = newPoolEntry();
        ytByVid[vid] = fresh;
        fresh.vid = vid;
        if(ytReady) buildPlayer(fresh, vid);
        // otherwise onYouTubeIframeAPIReady builds it once the API script lands
      }
    });

    trimPool();
  }

  function applyToEntry(entry){
    if(!entry.ready || !entry.player || !entry.vid) return;
    var d = activeAudio[entry.vid];
    if(!d) return;
    try{
      entry.player.unMute();
      entry.player.setVolume(d.volume);
      if(d.playToken !== entry.lastToken){
        entry.lastToken = d.playToken;
        entry.player.seekTo(0);
        entry.player.playVideo();
      } else if(entry.player.getPlayerState && entry.player.getPlayerState() !== YT.PlayerState.PLAYING){
        entry.player.playVideo();
      }
    }catch(err){ /* ignore - player not ready for this call yet */ }
  }

  function scheduleStuckCheck(entry){
    setTimeout(function(){
      if(!entry.vid || !entry.player) return;
      try{
        var st = entry.player.getPlayerState();
        if(st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.BUFFERING) showAudioUnlock();
      }catch(err){}
    }, STUCK_CHECK_MS);
  }

  /* ---- the one unlock gesture ---- */

  // Any click / tap / key anywhere on the page counts — the little badge is just a hint, not
  // the only target. The listeners stay installed so a later gesture can still rescue things.
  function onUserGesture(){
    var any = false;
    Object.keys(ytByVid).forEach(function(vid){
      var e = ytByVid[vid];
      if(!e.ready || !e.player) return;
      any = true;
      try{ e.player.unMute(); }catch(err){}
      applyToEntry(e);
      try{ e.player.playVideo(); }catch(err){}
    });
    if(any) warmPool();
    removeAudioUnlock();
  }

  function showAudioUnlock(){
    if($('audioUnlock')) return;
    var el = document.createElement('div');
    el.id = 'audioUnlock';
    el.textContent = '🔈 Kliknij gdziekolwiek, aby włączyć dźwięk';
    el.style.cssText = 'position:fixed;bottom:14px;right:14px;background:rgba(0,0,0,.65);color:#fff;'
      + 'padding:8px 14px;border-radius:20px;font-size:12px;cursor:pointer;z-index:999;'
      + 'font-family:sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.4);';
    document.body.appendChild(el);
  }
  function removeAudioUnlock(){
    var el = $('audioUnlock');
    if(el) el.remove();
  }

  window.onYouTubeIframeAPIReady = function(){
    ytReady = true;
    ytPool.forEach(function(e){
      if(!e.player && e.vid) buildPlayer(e, e.vid);
    });
  };

  function boot(){
    track = $('fearTrack'); panel = $('fearPanel'); stage = $('flameStage'); canvas = $('flameCanvas');
    ctx = canvas.getContext('2d'); statusEl = $('liveStatus');
    sceneDisplay = $('sceneDisplay'); sceneImg = $('sceneImg');

    buildTrack();
    measure();
    renderFear(); renderScene();

    window.addEventListener('resize', measure);
    requestAnimationFrame(step);

    // One gesture anywhere on the page unlocks audio for every player — current and pooled.
    // Kept installed (not once:true) so a later click can still rescue a stuck track.
    document.addEventListener('pointerdown', onUserGesture, true);
    document.addEventListener('touchstart', onUserGesture, true);
    document.addEventListener('keydown', onUserGesture, true);

    if(!('EventSource' in window)){
      setStatus('● Przeglądarka nie wspiera trybu live', 'warn');
      return;
    }

    var connectedOnce = false;
    var url = FEAR_DB_URL + '/live/' + FEAR_LIVE_SECRET + '.json';
    var es = new EventSource(url);

    function handle(e){
      try{
        var payload = JSON.parse(e.data);
        if(!payload) return;
        applyPatch(payload.path, payload.data);
        renderFear();
        renderScene();
        syncAudioFromState();
        connectedOnce = true;
        setStatus('● Live', 'ok');
      }catch(err){ /* ignore malformed event */ }
    }

    es.addEventListener('put', handle);
    es.addEventListener('patch', handle);
    es.onerror = function(){
      setStatus(connectedOnce ? '● Łączenie ponownie…' : '● Brak połączenia z serwerem', 'warn');
    };

    // pomocnicze do testowania lokalnie z konsoli, bez ruszania Firebase: __fearDebugSet(7)
    window.__fearDebugSet = function(v){ state.fear = v; renderFear(); };
    window.__fearDebugColors = function(c){ state.colors = c; renderFear(); };
    window.__audioDebugSet = function(a){ state.audio = a; syncAudioFromState(); }; // a: {videoId:{loop,volume,playToken},...}
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
