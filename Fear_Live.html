  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    min-height:100vh; min-height:100dvh;
    background:
      radial-gradient(1200px 700px at 12% -10%, rgba(200,149,47,0.08), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(107,132,85,0.06), transparent 55%),
      var(--ink);
    color:var(--text);
    font-family:'Work Sans','Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }

  .wrap{ width:100%; max-width:720px; display:flex; flex-direction:column; align-items:center; gap:18px; }

  .scene-display{
    width:100%; border-radius:16px; overflow:hidden; border:1px solid var(--line);
    background:var(--ink-2); box-shadow:var(--shadow);
    display:none;
  }
  .scene-display.visible{ display:block; }
  .scene-display img{ display:block; width:100%; max-height:66vh; object-fit:contain; background:#000; }

  .fear-panel{
    position:relative; width:100%; flex-shrink:0;
    background:
      radial-gradient(620px 280px at 50% -30%, rgba(var(--fear-color),0.14), transparent 70%),
      var(--panel);
    border:1px solid var(--gold-bright);
    outline:1px solid rgba(224,179,85,0.32);
    outline-offset:-6px;
    border-radius:18px;
    padding:22px clamp(12px,4.4vw,34px) 18px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .corner-dot{ position:absolute; width:5px; height:5px; border-radius:50%; background:var(--gold-bright); box-shadow:0 0 6px 1px rgba(224,179,85,0.65); z-index:3; }
  .corner-dot.tl{ top:10px; left:10px; } .corner-dot.tr{ top:10px; right:10px; }
  .corner-dot.bl{ bottom:10px; left:10px; } .corner-dot.br{ bottom:10px; right:10px; }

  .flame-stage{ position:relative; z-index:1; height:clamp(88px,21vw,116px); }
  .flame-canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  .fear-track{
    position:relative; z-index:1; height:100%;
    display:flex; align-items:flex-end; justify-content:center; flex-wrap:nowrap; pointer-events:none;
  }
  .flame-group{ display:flex; align-items:flex-end; height:100%; gap:clamp(3px,1.5vw,11px); }

  .fear-counter{
    flex-shrink:0; width:clamp(48px,10.5vw,60px); height:clamp(48px,10.5vw,60px); border-radius:50%;
    border:2px solid var(--gold-bright); background:var(--ink-2);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; font-size:clamp(1.15rem,3.2vw,1.45rem); color:var(--text);
    box-shadow: inset 0 0 12px rgba(0,0,0,0.55), 0 0 12px rgba(224,179,85,0.25);
    margin:0 clamp(7px,2.4vw,18px);
    font-variant-numeric: tabular-nums;
    position:relative; z-index:2;
    align-self:flex-end;
    margin-bottom: clamp(4px,1vw,8px);
  }

  .flame-slot{ position:relative; width:clamp(22px,6.8vw,36px); height:100%; flex-shrink:0; }

  .fp-icon-wrap{
    position:absolute; left:50%; bottom:0; width:100%; aspect-ratio:400/668;
    transform:translateX(-50%); pointer-events:none;
  }
  .fp-glow{
    position:absolute; inset:-55%; z-index:0; pointer-events:none; border-radius:50%;
    background:radial-gradient(circle, rgba(var(--fear-color),1) 0%, rgba(var(--fear-color),0) 68%);
    opacity:0; filter:blur(6px);
  }
  .flame-slot.lit .fp-glow{ animation:fear-flicker 2.4s infinite ease-in-out; }
  .fp-fill{
    position:absolute; inset:0; z-index:1;
    -webkit-mask-image:var(--token-icon); mask-image:var(--token-icon);
    -webkit-mask-size:100% 100%; mask-size:100% 100%;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center top; mask-position:center top;
    background-color:rgba(150,160,178,0.30);
    transition:background-color .4s ease;
  }
  .flame-slot.lit .fp-fill{
    background-color:rgb(var(--fear-color));
    filter:drop-shadow(0 0 3px rgba(0,0,0,0.45)) drop-shadow(0 0 7px rgba(var(--fear-color),0.55));
  }

  @keyframes fear-flicker{
    0%   { opacity: var(--flicker-amt,0.4); }
    8%   { opacity: calc(var(--flicker-amt,0.4) * 0.45); }
    15%  { opacity: var(--flicker-amt,0.4); }
    25%  { opacity: calc(var(--flicker-amt,0.4) * 0.15); }
    33%  { opacity: calc(var(--flicker-amt,0.4) * 0.75); }
    45%  { opacity: var(--flicker-amt,0.4); }
    58%  { opacity: calc(var(--flicker-amt,0.4) * 0.35); }
    70%  { opacity: calc(var(--flicker-amt,0.4) * 0.85); }
    80%  { opacity: var(--flicker-amt,0.4); }
    90%  { opacity: calc(var(--flicker-amt,0.4) * 0.55); }
    100% { opacity: var(--flicker-amt,0.4); }
  }

  .live-status{
    font-family:'JetBrains Mono',monospace; font-size:0.72rem; letter-spacing:0.04em;
    color:var(--text-faint); display:flex; align-items:center; gap:6px;
  }
  .live-status.ok{ color:var(--moss-bright); }
  .live-status.warn{ color:var(--rust-bright); }

</style>
</head>
<body>
  <div class="wrap">
    <div class="fear-panel" id="fearPanel">
      <span class="corner-dot tl"></span><span class="corner-dot tr"></span>
      <span class="corner-dot bl"></span><span class="corner-dot br"></span>
      <div class="flame-stage" id="flameStage">
        <canvas class="flame-canvas" id="flameCanvas"></canvas>
        <div class="fear-track" id="fearTrack"></div>
      </div>
    </div>
    <div class="scene-display" id="sceneDisplay"><img id="sceneImg" alt="Scena"></div>
    <div class="live-status" id="liveStatus">● Łączenie…</div>
  </div>

<script>
(function(){
  'use strict';
  var FEAR_DB_URL = 'https://daggerheart-fear-default-rtdb.europe-west1.firebasedatabase.app';
  var FEAR_LIVE_SECRET = '136e9f278a37dedcbebfc35bc7a0ef867ca6841e';
  var FEAR_MAX = 12;
  var FEAR_STOPS = [
    [88,140,199],   // calm - blue
    [130,105,190],  // violet
    [188,80,120],   // rose
    [196,45,45]     // aggressive - red
  ];
  var HOT = [255,250,232];

  // local mirror of live/<secret> in Firebase
  var state = { fear: 0, scene: { file: '', visible: false } };

  var track, panel, stage, canvas, ctx, statusEl, sceneDisplay, sceneImg;
  var slotEls = [], iconWraps = [];
  var flames = [];
  var emitX = [], emitY = [], smokeMaxH = [], iconW = [], iconBottom = [];
  var embers = [];
  var dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
  var cssW = 0, cssH = 0;
  var time = 0, lastT = null;
  var lastFear = 0;

  function $(id){ return document.getElementById(id); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function rand(a,b){ return a + Math.random()*(b-a); }
  function lerpColor(a,b,t){ return [Math.round(lerp(a[0],b[0],t)), Math.round(lerp(a[1],b[1],t)), Math.round(lerp(a[2],b[2],t))]; }

  function colorForFear(t){
    var n = FEAR_STOPS.length - 1;
    var pos = Math.max(0, Math.min(1, t)) * n;
    var idx = Math.min(n - 1, Math.floor(pos));
    return FEAR_STOPS[idx].map(function(v,i){ return Math.round(v + (FEAR_STOPS[idx+1][i]-v) * (pos-idx)); });
  }

  // tempo/energia dymu rośnie z Fear: przy niskim leniwy i wolny, przy wysokim gwałtowny i gęsty
  function paramsForFear(fearVal){
    var t = fearVal/FEAR_MAX;
    return { t:t, energy: lerp(0.22, 1.6, t), vigor: lerp(0.45, 1.85, t) };
  }

  // punkty na całym znaczniku, z których wydobywają się smużki dymu — nie tylko czubek.
  var ANCHORS = [
    { fx:-0.68, fy:0.10, dir:-1, hMul:0.60, w:0.40 },
    { fx: 0.62, fy:0.05, dir: 1, hMul:0.56, w:0.38 },
    { fx:-0.48, fy:0.28, dir:-1, hMul:0.72, w:0.38 },
    { fx: 0.50, fy:0.34, dir: 1, hMul:0.76, w:0.39 },
    { fx:-0.32, fy:0.50, dir:-1, hMul:0.84, w:0.37 },
    { fx: 0.34, fy:0.55, dir: 1, hMul:0.86, w:0.37 },
    { fx:-0.16, fy:0.72, dir:-1, hMul:0.94, w:0.34 },
    { fx: 0.20, fy:0.80, dir: 1, hMul:0.98, w:0.34 },
    { fx:-0.05, fy:0.92, dir:-1, hMul:1.02, w:0.32 },
    { fx: 0.08, fy:0.96, dir: 1, hMul:1.04, w:0.32 }
  ];

  function makeTendrilRows(){
    var ROWS = 8;
    var rows = [];
    for(var r=0;r<=ROWS;r++){
      rows.push({
        phaseA: Math.random()*Math.PI*2, freqA: rand(0.55,1.1),
        phaseB: Math.random()*Math.PI*2, freqB: rand(1.3,2.1)
      });
    }
    return rows;
  }

  function makeFlameState(){
    var tendrils = ANCHORS.map(function(a){
      return {
        fx:a.fx, fy:a.fy, dir:a.dir, hMul:a.hMul, w:a.w,
        rows: makeTendrilRows(),
        outPhase: Math.random()*Math.PI*2, outFreq: rand(0.5,0.85),
        swayPhase: Math.random()*Math.PI*2, swayFreq: rand(0.9,1.4),
        outAmt: rand(0.85,1.2)
      };
    });
    return { height:0, targetHeight:0, flare:0, tendrils:tendrils, emberAcc: Math.random() };
  }

  function buildTrack(){
    track.innerHTML = '';
    var groupL = document.createElement('div'); groupL.className = 'flame-group';
    var groupR = document.createElement('div'); groupR.className = 'flame-group';
    var counter = document.createElement('div'); counter.className = 'fear-counter'; counter.id = 'fearCounter';

    slotEls = []; iconWraps = []; flames = [];
    for(var i=0;i<FEAR_MAX;i++){
      var slot = document.createElement('div');
      slot.className = 'flame-slot';
      slot.innerHTML = '<div class="fp-icon-wrap"><div class="fp-glow"></div><div class="fp-fill"></div></div>';
      (i<6?groupL:groupR).appendChild(slot);
      slotEls.push(slot);
      iconWraps.push(slot.querySelector('.fp-icon-wrap'));
      flames.push(makeFlameState());
    }
    track.appendChild(groupL); track.appendChild(counter); track.appendChild(groupR);
  }

  function measure(){
    var stageRect = stage.getBoundingClientRect();
    cssW = stageRect.width; cssH = stageRect.height;
    if(cssW < 1 || cssH < 1) return;
    canvas.width = Math.round(cssW*dpr); canvas.height = Math.round(cssH*dpr);
    canvas.style.width = cssW+'px'; canvas.style.height = cssH+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);

    emitX = []; emitY = []; smokeMaxH = []; iconW = []; iconBottom = [];
    for(var i=0;i<iconWraps.length;i++){
      var r = iconWraps[i].getBoundingClientRect();
      var cx = (r.left + r.width/2) - stageRect.left;
      var topY = r.top - stageRect.top;
      var botY = r.bottom - stageRect.top;
      emitX.push(cx); emitY.push(topY); iconBottom.push(botY); iconW.push(r.width);
      smokeMaxH.push(Math.max(20, topY - 6));
    }
  }

  function smoothClosedPath(pts){
    var n = pts.length;
    ctx.moveTo((pts[0][0]+pts[n-1][0])/2, (pts[0][1]+pts[n-1][1])/2);
    for(var k=0;k<n;k++){
      var p0=pts[k], p1=pts[(k+1)%n];
      var mx=(p0[0]+p1[0])/2, my=(p0[1]+p1[1])/2;
      ctx.quadraticCurveTo(p0[0],p0[1], mx, my);
    }
    ctx.closePath();
  }

  function tendrilAnchor(i, tendril){
    var ax = emitX[i] + tendril.fx * (iconW[i]*0.5);
    var ay = iconBottom[i] - tendril.fy * (iconBottom[i]-emitY[i]);
    var room = Math.max(10, ay - 6);
    var maxH = room * lerp(0.34, 0.56, tendril.hMul);
    return { x:ax, y:ay, maxH:maxH };
  }

  function buildTendrilPts(anchor, tendril, effHeight, vigor, tt, widthScale){
    var left=[], right=[];
    var rows = tendril.rows;
    for(var r=0;r<rows.length;r++){
      var hf = r/(rows.length-1);
      var row = rows[r];
      var hook = tendril.dir * tendril.outAmt * hf * Math.exp(1 - hf*1.7) * (1.8 + vigor*3.2);
      var ambientSway = hf*1.3*(1.4+vigor*2.6) * Math.sin(tt*tendril.swayFreq + tendril.swayPhase);
      var lateral = hook + ambientSway;
      var wob = Math.sin(tt*row.freqA+row.phaseA)*0.5 + Math.sin(tt*row.freqB+row.phaseB)*0.3;
      var rw = tendril._baseWidth*widthScale*Math.pow(1-hf, 0.8);
      rw *= Math.max(0.16, 1 + wob*(0.12+hf*0.4)*vigor);
      var x = anchor.x + lateral;
      var y = anchor.y - hf*effHeight;
      left.push([x-rw/2,y]); right.push([x+rw/2,y]);
    }
    return left.concat(right.reverse());
  }

  function drawBaseHaze(i, fs, fearColor){
    var h = fs.height * (1 + fs.flare*0.3);
    if(h < 0.02) return;
    var cx = emitX[i], topY = emitY[i], botY = iconBottom[i], w = iconW[i];
    var puffs = [
      { fy:0.06, r:w*0.62, a:0.30 },
      { fy:0.32, r:w*0.58, a:0.26 },
      { fy:0.58, r:w*0.52, a:0.22 },
      { fy:0.82, r:w*0.42, a:0.18 },
      { fy:0.98, r:w*0.30, a:0.14 }
    ];
    ctx.filter = 'blur(4px)';
    ctx.globalCompositeOperation = 'lighter';
    for(var p=0;p<puffs.length;p++){
      var puff = puffs[p];
      if(puff.fy > h) continue;
      var py = botY - puff.fy*(botY-topY)*1.15;
      var fade = 1 - puff.fy*0.4;
      var g = ctx.createRadialGradient(cx, py, 0, cx, py, puff.r);
      g.addColorStop(0, 'rgba('+fearColor[0]+','+fearColor[1]+','+fearColor[2]+','+(puff.a*fade)+')');
      g.addColorStop(1, 'rgba('+fearColor[0]+','+fearColor[1]+','+fearColor[2]+',0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, py, puff.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.filter = 'none';
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawFlame(i, fs, params, fearColor){
    var tt = time*params.energy;
    var flareBoost = 1 + fs.flare*0.6;
    var tendrils = fs.tendrils;
    var tipForEmber = null;

    drawBaseHaze(i, fs, fearColor);

    for(var k=0;k<tendrils.length;k++){
      var tendril = tendrils[k];
      tendril._baseWidth = iconW[i]*tendril.w;
      var anchor = tendrilAnchor(i, tendril);
      var effHeight = anchor.maxH * fs.height * (1 + fs.flare*0.4);
      if(effHeight < 0.5) continue;

      var outerPts = buildTendrilPts(anchor, tendril, effHeight, params.vigor, tt, 1);
      var gOuter = ctx.createLinearGradient(anchor.x, anchor.y, anchor.x, anchor.y-effHeight);
      gOuter.addColorStop(0, 'rgba('+HOT[0]+','+HOT[1]+','+HOT[2]+','+Math.min(1,0.85*flareBoost)+')');
      gOuter.addColorStop(0.34, 'rgba('+HOT[0]+','+HOT[1]+','+HOT[2]+',0.72)');
      gOuter.addColorStop(1, 'rgba('+fearColor[0]+','+fearColor[1]+','+fearColor[2]+',0.62)');
      ctx.filter = 'blur(1.1px)';
      ctx.beginPath(); smoothClosedPath(outerPts);
      ctx.fillStyle = gOuter; ctx.fill();
      ctx.filter = 'none';

      var innerPts = buildTendrilPts(anchor, tendril, effHeight*0.92, params.vigor*0.75, tt*1.04, 0.4);
      var gInner = ctx.createLinearGradient(anchor.x, anchor.y, anchor.x, anchor.y-effHeight*0.92);
      gInner.addColorStop(0, 'rgba(255,253,244,'+Math.min(1,0.9*flareBoost)+')');
      gInner.addColorStop(0.55, 'rgba(255,250,235,0.42)');
      gInner.addColorStop(1, 'rgba(255,250,235,0.03)');
      ctx.beginPath(); smoothClosedPath(innerPts);
      ctx.fillStyle = gInner; ctx.fill();

      if(fs.height > 0.55) tipForEmber = { x: anchor.x, y: anchor.y-effHeight*0.9 };
    }

    fs.emberAcc += (1/60) * (0.5 + params.t*2.4);
    if(fs.emberAcc > 1 && tipForEmber){
      fs.emberAcc = 0;
      embers.push({
        x: tipForEmber.x + rand(-3,3), y: tipForEmber.y,
        vx: rand(-8,8), vy: -rand(16,30)*(0.6+params.t),
        life: rand(0.55,0.95), age:0, size: rand(1.1,2.0)
      });
    }
  }

  function drawEmbers(dt, fearColor){
    ctx.globalCompositeOperation = 'lighter';
    var alive = [];
    for(var k=0;k<embers.length;k++){
      var e = embers[k];
      e.age += dt;
      var t = e.age/e.life;
      if(t>=1) continue;
      e.x += e.vx*dt; e.y += e.vy*dt;
      var alpha = (1-t);
      var col = lerpColor(HOT, fearColor, Math.min(1,t*1.3));
      ctx.beginPath();
      ctx.fillStyle = 'rgba('+col[0]+','+col[1]+','+col[2]+','+(alpha*0.85)+')';
      ctx.arc(e.x, e.y, Math.max(0.1,e.size*(1-t*0.4)), 0, Math.PI*2);
      ctx.fill();
      alive.push(e);
    }
    embers = alive;
    ctx.globalCompositeOperation = 'source-over';
  }

  function renderFear(){
    var fear = Math.max(0, Math.min(FEAR_MAX, Number(state.fear) || 0));
    var t = fear / FEAR_MAX;
    var col = colorForFear(t);
    panel.style.setProperty('--fear-color', col.join(','));
    panel.style.setProperty('--flicker-amt', (0.32+t*0.4).toFixed(3));

    if(track.childElementCount !== 3){ buildTrack(); measure(); }
    var counterEl = $('fearCounter');
    if(counterEl) counterEl.textContent = fear;

    for(var i=0;i<FEAR_MAX;i++){
      var shouldBurn = i < fear;
      var fs = flames[i];
      slotEls[i].classList.toggle('lit', shouldBurn);
      if(shouldBurn && fs.targetHeight===0){ fs.targetHeight = 1; fs.flare = 1; }
      else if(!shouldBurn && fs.targetHeight===1){ fs.targetHeight = 0; }
    }
    lastFear = fear;
  }

  function step(ts){
    if(lastT===null) lastT = ts;
    var dt = Math.min(0.05, (ts-lastT)/1000);
    lastT = ts; time += dt;

    if(cssW < 1) { requestAnimationFrame(step); return; }

    var params = paramsForFear(lastFear);
    var fearColor = colorForFear(lastFear/FEAR_MAX);

    ctx.clearRect(0,0,cssW,cssH);

    for(var i=0;i<FEAR_MAX;i++){
      var fs = flames[i];
      if(!fs) continue;
      var growRate = (fs.targetHeight>fs.height ? 8.5 : 6.5) * (0.55+params.energy*0.55);
      fs.height += (fs.targetHeight - fs.height) * Math.min(1, dt*growRate);
      if(Math.abs(fs.targetHeight-fs.height) < 0.003) fs.height = fs.targetHeight;
      fs.flare *= Math.pow(0.006, dt);
      if(fs.height > 0.01 || fs.flare > 0.02){ drawFlame(i, fs, params, fearColor); }
    }

    drawEmbers(dt, fearColor);

    requestAnimationFrame(step);
  }

  function renderScene(){
    var sc = state.scene || {};
    var show = !!(sc.visible && sc.file);
    if(show){
      if(sceneImg.getAttribute('src') !== sc.file) sceneImg.setAttribute('src', sc.file);
      sceneDisplay.classList.add('visible');
    } else {
      sceneDisplay.classList.remove('visible');
    }
  }

  function setStatus(text, cls){
    statusEl.textContent = text;
    statusEl.className = 'live-status' + (cls ? ' ' + cls : '');
  }

  // apply a Firebase SSE event's {path, data} onto our local `state` mirror.
  // path is '/' (whole node), '/fear', '/scene', or a deeper subpath.
  function applyPatch(path, data){
    if(!path || path === '/'){
      state = data && typeof data === 'object' ? data : { fear: 0, scene: { file:'', visible:false } };
      if(!state.scene) state.scene = { file:'', visible:false };
      return;
    }
    var parts = path.replace(/^\//,'').split('/').filter(Boolean);
    if(!parts.length) return;
    if(parts[0] === 'fear'){
      state.fear = data;
    } else if(parts[0] === 'scene'){
      if(parts.length === 1){
        state.scene = data && typeof data === 'object' ? data : { file:'', visible:false };
      } else {
        if(!state.scene) state.scene = { file:'', visible:false };
        state.scene[parts[1]] = data;
      }
    }
  }

  function boot(){
    track = $('fearTrack'); panel = $('fearPanel'); stage = $('flameStage'); canvas = $('flameCanvas');
    ctx = canvas.getContext('2d'); statusEl = $('liveStatus');
    sceneDisplay = $('sceneDisplay'); sceneImg = $('sceneImg');

    buildTrack();
    measure();
    renderFear(); renderScene();

    window.addEventListener('resize', measure);
    requestAnimationFrame(step);

    if(!('EventSource' in window)){
      setStatus('● Przeglądarka nie wspiera trybu live', 'warn');
      return;
    }

    var connectedOnce = false;
    var url = FEAR_DB_URL + '/live/' + FEAR_LIVE_SECRET + '.json';
    var es = new EventSource(url);

    function handle(e){
      try{
        var payload = JSON.parse(e.data);
        if(!payload) return;
        applyPatch(payload.path, payload.data);
        renderFear();
        renderScene();
        connectedOnce = true;
        setStatus('● Live', 'ok');
      }catch(err){ /* ignore malformed event */ }
    }

    es.addEventListener('put', handle);
    es.addEventListener('patch', handle);
    es.onerror = function(){
      setStatus(connectedOnce ? '● Łączenie ponownie…' : '● Brak połączenia z serwerem', 'warn');
    };

    // pomocnicze do testowania lokalnie z konsoli, bez ruszania Firebase: __fearDebugSet(7)
    window.__fearDebugSet = function(v){ state.fear = v; renderFear(); };
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
